<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Background Rounded Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Inner Badge Container -->
  <rect x="40" y="40" width="432" height="432" rx="100" fill="#18181b" filter="url(#dropShadow)"/>
  
  <!-- Shield Icon -->
  <path d="M256 80 L380 130 C380 260 256 370 256 410 C256 370 132 260 132 130 Z" fill="#27272a" stroke="#ea580c" stroke-width="8"/>
  
  <!-- Wrench & Lightning Core -->
  <g transform="translate(196, 170) scale(5)" fill="none" stroke="#ea580c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Lightning Bolt / AI Energy -->
    <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" fill="#ea580c" stroke="#ffffff" stroke-width="1.2"/>
  </g>
  
  <!-- Sparkles -->
  <circle cx="340" cy="160" r="10" fill="#ffffff"/>
  <circle cx="170" cy="320" r="7" fill="#fed7aa"/>
</svg>
